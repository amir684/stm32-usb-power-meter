; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; USB hub power meter: bare STM32F051K8T6 (internal clock, 48 MHz), INA219, ST7567 128x64 LCD
; and a 3-button joystick. Programmed over SWD with an ST-Link (the F051 has no USB).
; The board definition is local: boards/genericSTM32F051K8.json

[env:meter]
platform = ststm32@19.7.1   ; pinned: Arduino core 2.12, the version tested on the hardware (20.x brings core 3.0)
board = genericSTM32F051K8
framework = arduino
upload_protocol = stlink
debug_tool = stlink
board_build.ldscript = boards/ldscript_f051x8.ld   ; the core's F051K8T variant ships without one (memory sizes come from the board)
board_upload.maximum_size = 63488   ; the last 2 KB of flash hold the settings and the totals
lib_deps =
    olikraus/U8g2@2.36.18
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_SERIAL_DISABLED   ; no serial adapter: everything is on the LCD
    -DBL_MAX_PWM=64      ; backlight on a GPIO with no series resistor: keep this low (64/255 = 25%)
